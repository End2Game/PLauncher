name: Windows build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare distributable ZIP
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value }
          $stage = Join-Path $env:RUNNER_TEMP 'PLauncher-dist'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/plauncher.exe' (Join-Path $stage 'PLauncher.exe')
          Copy-Item README.md, LICENSE (Join-Path $stage '.')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "PLauncher-$version-Windows-x64.zip") -Force

      - name: Upload packaged launcher
        uses: actions/upload-artifact@v4
        with:
          name: PLauncher-Windows-x64
          path: PLauncher-*-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PLauncher ${{ github.ref_name }}
          generate_release_notes: true
          files: PLauncher-*-Windows-x64.zip
